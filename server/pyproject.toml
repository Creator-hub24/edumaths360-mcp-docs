[project]
name = "edumaths360-mcp"
version = "0.1.0"
description = "Edumaths360 Practice Server: an MCP server that generates Class 6-10 maths problems, checks answers, and gives progressive hints that never reveal the final answer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vaibhav Gupta", email = "Edumaths360@gmail.com" }]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
edumaths360-mcp = "edumaths360_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edumaths360_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
