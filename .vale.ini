# Vale prose linter: https://vale.sh
# Run locally with: vale docs-site/docs README.md
StylesPath = .github/vale/styles
MinAlertLevel = warning
Vocab = Edumaths360

[*.{md,mdx}]
BasedOnStyles = Vale, Edumaths360
# Ignore JSX/MDX import lines and component tags
BlockIgnores = (?s)^import .*? from .*?;?$
TokenIgnores = (<[A-Z][A-Za-z]* ?/>), (\{[^}]*\})
